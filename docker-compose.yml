services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    ports:
      # Porta no host configurável (DB_PORT) para não brigar com um PostgreSQL local; dentro da rede continua 5432.
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Scripts numerados rodam em ordem na primeira inicialização do volume (pasta vazia).
      - ./scripts:/docker-entrypoint-initdb.d:ro
      - oficina-db-data:/var/lib/postgresql/data
    healthcheck:
      # Via TCP (-h localhost): o servidor temporário que roda os scripts só escuta no socket Unix,
      # então o container só fica "healthy" quando o servidor definitivo está no ar.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-oficina} -d ${POSTGRES_DB:-oficina}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    container_name: oficina-api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro da rede do Compose o banco atende pelo nome do serviço, na porta interna: a
      # CONNECTION_STRING do .env aponta para localhost e serve para a API rodando fora.
      # A senha entre aspas simples: sem elas, um `;` ou `=` na senha quebraria a leitura da
      # connection string pelo Npgsql.
      CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password='${POSTGRES_PASSWORD}'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Sem JWT_SECRET no .env a API sobe com este valor; troque fora do ambiente local.
      JWT_SECRET: ${JWT_SECRET:-oficina-maggi-jwt-secret-chave-de-pelo-menos-32-caracteres}
      TZ: America/Sao_Paulo
    ports:
      # A mesma 5062 que o dotnet run usa, para o frontend não precisar saber de onde a API vem.
      - "${API_PORT:-5062}:8080"

volumes:
  oficina-db-data:
